<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KatalogKu — Katalog Digital & Order Cepat</title>
  </head>
  <body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen pb-20">

    <!-- ================= NAVBAR ================= -->
    <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
        
        <!-- Logo -->
        <a href="#" class="flex items-center space-x-2 text-xl font-bold tracking-tight">
          <span class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center text-white text-sm font-black shadow-lg shadow-emerald-500/20">K</span>
          <span>Katalog<span class="text-emerald-400">Ku</span></span>
        </a>

        <!-- Tombol Keranjang Belanja -->
        <button id="cart-btn" type="button" class="relative flex items-center gap-2 px-4 py-2 bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-xl text-sm font-medium transition duration-200">
          <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
          </svg>
          <span class="hidden sm:inline">Keranjang</span>
          <!-- Badge Jumlah Item -->
          <span id="cart-count" class="bg-emerald-500 text-slate-950 font-bold text-xs px-2 py-0.5 rounded-full">0</span>
        </button>

      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 pt-10">

      <!-- ================= SEARCH & CATEGORY FILTER ================= -->
      <section class="mb-10 space-y-6">
        <div class="text-center sm:text-left">
          <h1 class="text-3xl font-extrabold text-white tracking-tight">Daftar Produk Pilihan</h1>
          <p class="text-slate-400 text-sm mt-1">Pilih produk favorit Anda dan checkout langsung via WhatsApp.</p>
        </div>

        <!-- Baris Kontrol: Input Search & Kategori -->
        <div class="flex flex-col sm:flex-row gap-4 justify-between items-stretch sm:items-center">
          
          <!-- Input Search -->
          <div class="relative flex-1 max-w-md">
            <input 
              id="search-input" 
              type="text" 
              placeholder="Cari nama produk..." 
              class="w-full bg-slate-900 border border-slate-800 focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 outline-none transition"
            />
          </div>

          <!-- Kategori Tabs -->
          <div id="category-filters" class="flex flex-wrap gap-2">
            <button class="filter-btn active px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 text-white hover:text-white transition" data-category="all">Semua</button>
            <button class="filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition" data-category="minuman">Minuman</button>
            <button class="filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition" data-category="makanan">Makanan</button>
            <button class="filter-btn px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition" data-category="merchandise">Merchandise</button>
          </div>

        </div>
      </section>

      <!-- ================= TEMPAT RAK PRODUK DINAMIS ================= -->
      <!-- Loading State -->
      <div id="loading-state" class="text-center py-16 text-slate-500 text-sm">
        <span class="inline-block animate-spin mr-2">⏳</span> Memuat katalog produk...
      </div>

      <!-- Grid Wadah Produk (Kosong, nanti diisi JS) -->
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Kartu produk akan disuntikkan ke sini oleh JavaScript -->
      </div>

      <!-- Empty State (Muncul kalau pencarian tidak ketemu) -->
      <div id="empty-state" class="hidden text-center py-16">
        <p class="text-slate-400 font-medium">Produk tidak ditemukan 🔍</p>
        <p class="text-slate-600 text-xs mt-1">Coba gunakan kata kunci lain atau pilih kategori lain.</p>
      </div>

    </main>

        <!-- ================= CART DRAWER (SIDEBAR KANAN) ================= -->
    <div id="cart-drawer" class="fixed inset-0 z-50 hidden">
      <!-- Backdrop Gelap -->
      <div id="cart-backdrop" class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity"></div>

      <!-- Panel Samping Geser -->
      <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
        <div class="w-screen max-w-md bg-slate-900 border-l border-slate-800 p-6 flex flex-col justify-between shadow-2xl">
          
          <!-- Header Drawer -->
          <div>
            <div class="flex items-center justify-between border-b border-slate-800 pb-4">
              <h2 class="text-lg font-bold text-white flex items-center gap-2">
                <span>🛒 Keranjang Belanja</span>
              </h2>
              <button id="close-cart-btn" class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition">
                ✕
              </button>
            </div>

            <!-- Wadah Daftar Barang yang Dibeli -->
            <div id="cart-items" class="mt-6 space-y-4 max-h-[50vh] overflow-y-auto pr-1">
              <!-- Item keranjang akan dirender JS di sini -->
            </div>

            <!-- Pesan jika keranjang kosong -->
            <div id="cart-empty-msg" class="text-center py-12 text-slate-500 text-sm">
              Keranjang masih kosong nih 🛍️
            </div>
          </div>

          <!-- Footer Drawer: Total & Tombol WA Checkout -->
          <div class="border-t border-slate-800 pt-6 space-y-4">
            <div class="flex justify-between items-center text-sm">
              <span class="text-slate-400">Total Pembayaran:</span>
              <span id="cart-total" class="text-xl font-black text-emerald-400">Rp 0</span>
            </div>

            <button 
              id="checkout-btn" 
              type="button" 
              class="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
              disabled
            >
              <span>Checkout via WhatsApp</span>
              <span>💬</span>
            </button>
          </div>

        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
